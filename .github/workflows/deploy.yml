name: Deploy MyTube (private source to public Pages)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mytube-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: t-wakasa/mytube
          ref: master
          path: source
          token: ${{ secrets.MYTUBE_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install, typecheck, and test
        working-directory: source
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build for the public Pages project URL
        working-directory: source
        run: npx vite build --base=/mytube-pages/

      - name: Scan built text assets for common secret patterns
        shell: bash
        run: |
          if grep -RIE --include='*.js' --include='*.html' --include='*.css' \
            '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            source/dist; then
            echo 'Potential credential detected in built assets.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload only built website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
